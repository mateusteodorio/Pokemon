<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Temos Que Pegar</title>
</head>

<body>
    <header>

        <h1>Escolha seu Pokemon</h1>

    </header>

    <main class="Estrutura">
     


        <div class="cards-lista">
            <article class="card planta">
                <figure class="avatar-container">
                    <div class="aro-avatar"></div>
                    <img src="imagens/Bulbasauro.png" alt="Bulbasauro imagem em 3D">
                </figure>
                <h2 class="nome-pokemon">Bulbasauro</h2>
                <p class="tipo-pokemon">Planta</p>
                <dl class="lista-estatisticas">

                    <dt class="nome-estatistica">Força</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 60%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Velocidade</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 70%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Peso</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 45%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Habilidade</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 75%;"></div>
                    </dd>
                </dl>
            </article>
        </div>

        <div class="cards-lista">
            <article class="card agua">
                <figure class="avatar-container">
                    <div class="aro-avatar"></div>
                    <img src="imagens/Squirt.png" alt="Bulbasauro imagem em 3D">
                </figure>
                <h2 class="nome-pokemon">Squirt</h2>
                <p class="tipo-pokemon">Agua</p>
                <dl class="lista-estatisticas">

                    <dt class="nome-estatistica">Força</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 40%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Velocidade</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 85%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Peso</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 30%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Habilidade</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 65%;"></div>
                    </dd>
                </dl>
            </article>
        </div>

        <div class="cards-lista">
            <article class="card fogo">
                <figure class="avatar-container">
                    <div class="aro-avatar"></div>
                    <img src="imagens/Charmander.png" alt="Bulbasauro imagem em 3D">
                </figure>
                <h2 class="nome-pokemon">Charmander</h2>
                <p class="tipo-pokemon">Fogo</p>
                <dl class="lista-estatisticas">

                    <dt class="nome-estatistica">Força</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 90%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Velocidade</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 45%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Peso</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 75%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Habilidade</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 70%;"></div>
                    </dd>
                </dl>
            </article>
        </div>

        <div class="cards-lista">
            <article class="card eletrico">
                <figure class="avatar-container">
                    <div class="aro-avatar"></div>
                    <img src="imagens/Pikachu.png" alt="Bulbasauro imagem em 3D">
                </figure>
                <h2 class="nome-pokemon">Pikachu</h2>
                <p class="tipo-pokemon">Elétrico</p>
                <dl class="lista-estatisticas">

                    <dt class="nome-estatistica">Força</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 80%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Velocidade</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 70%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Peso</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 25%;"></div>
                    </dd>

                    <dt class="nome-estatistica">Habilidade</dt>
                    <dd class="barra-estatistica">
                        <div class="barra-preenchimento" style="width: 90%;"></div>
                    </dd>
                </dl>
            </article>
        </div>



























    </main>

</body>

</html>
